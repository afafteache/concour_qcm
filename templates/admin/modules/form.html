{% extends 'admin/base_admin.html' %}
{% block title %}{{ action }} Module – Smart QCM{% endblock %}
{% block nav_modules %}active{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'module_liste' %}" class="btn btn-sm btn-outline-secondary mr-3"><i class="fas fa-arrow-left"></i></a>
  <h4 class="mb-0 font-weight-bold text-primary"><i class="fas fa-book mr-2"></i>{{ action }} un module</h4>
</div>
<div class="card shadow" style="max-width:500px;">
  <div class="card-body p-4">
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label><strong>Nom *</strong></label>
        <input type="text" class="form-control" name="nom" value="{{ module.nom|default:'' }}"
               placeholder="Ex: Français, Anglais, Culture Générale" required>
      </div>
      <div class="form-group">
        <label><strong>Description</strong></label>
        <textarea class="form-control" name="description" rows="3">{{ module.description|default:'' }}</textarea>
      </div>
      <div class="d-flex justify-content-end">
        <a href="{% url 'module_liste' %}" class="btn btn-secondary mr-2">Annuler</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i>{{ action }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
