{% extends 'admin/base_admin.html' %}
{% block title %}Confirmer la suppression – Smart QCM{% endblock %}

{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'dashboard_admin' %}" class="btn btn-sm btn-outline-secondary mr-3">
    <i class="fas fa-arrow-left"></i>
  </a>
  <h4 class="mb-0 font-weight-bold text-danger">
    <i class="fas fa-exclamation-triangle mr-2"></i>Confirmer la suppression
  </h4>
</div>

<div class="card shadow border-left-danger" style="max-width:600px;">
  <div class="card-body p-4 text-center">
    <i class="fas fa-trash-alt fa-4x text-danger mb-3"></i>
    <h5 class="font-weight-bold text-gray-800 mb-2">
      Êtes-vous sûr de vouloir supprimer ce {{ type }} ?
    </h5>
    <p class="text-muted mb-4">
      <strong>{{ objet }}</strong><br>
      <small>Cette action est irréversible.</small>
    </p>
    <form method="POST">
      {% csrf_token %}
      <a href="javascript:history.back()" class="btn btn-secondary mr-2">
        <i class="fas fa-times mr-1"></i>Annuler
      </a>
      <button type="submit" class="btn btn-danger">
        <i class="fas fa-trash mr-1"></i>Supprimer définitivement
      </button>
    </form>
  </div>
</div>
{% endblock %}
