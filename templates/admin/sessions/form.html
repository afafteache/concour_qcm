{% extends 'admin/base_admin.html' %}
{% block title %}{{ action }} Session – Smart QCM{% endblock %}
{% block nav_sessions %}active{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'session_liste' %}" class="btn btn-sm btn-outline-secondary mr-3"><i class="fas fa-arrow-left"></i></a>
  <h4 class="mb-0 font-weight-bold text-primary"><i class="fas fa-calendar-alt mr-2"></i>{{ action }} une session</h4>
</div>
<div class="card shadow" style="max-width:650px;">
  <div class="card-body p-4">
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label><strong>Nom de la session *</strong></label>
        <input type="text" class="form-control" name="nom_session"
               value="{{ session.nom_session|default:'' }}" required placeholder="Ex: Session Janvier 2026">
      </div>
      <div class="form-group">
        <label><strong>Concours *</strong></label>
        <select class="form-control" name="concours" required>
          <option value="">— Sélectionner —</option>
          {% for c in concours_list %}
          <option value="{{ c.pk }}" {% if session.concours_id == c.pk %}selected{% endif %}>{{ c.titre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label><strong>Début *</strong></label>
          <input type="datetime-local" class="form-control" name="date_heure_debut"
                 value="{{ session.date_heure_debut|date:'Y-m-d\TH:i'|default:'' }}" required>
        </div>
        <div class="form-group col-md-6">
          <label><strong>Fin</strong></label>
          <input type="datetime-local" class="form-control" name="date_heure_fin"
                 value="{{ session.date_heure_fin|date:'Y-m-d\TH:i'|default:'' }}">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label><strong>Durée (minutes)</strong></label>
          <input type="number" class="form-control" name="duree_minutes" min="1"
                 value="{{ session.duree_minutes|default:60 }}">
        </div>
        {% if session %}
        <div class="form-group col-md-6">
          <label><strong>État</strong></label>
          <select class="form-control" name="etat">
            <option value="planifiee" {% if session.etat == 'planifiee' %}selected{% endif %}>Planifiée</option>
            <option value="en_cours"  {% if session.etat == 'en_cours'  %}selected{% endif %}>En cours</option>
            <option value="terminee"  {% if session.etat == 'terminee'  %}selected{% endif %}>Terminée</option>
            <option value="annulee"   {% if session.etat == 'annulee'   %}selected{% endif %}>Annulée</option>
          </select>
        </div>
        {% endif %}
      </div>
      <div class="d-flex justify-content-end mt-3">
        <a href="{% url 'session_liste' %}" class="btn btn-secondary mr-2">Annuler</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i>{{ action }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
