{% extends 'admin/base_admin.html' %}
{% block title %}{{ action }} Concours – Smart QCM{% endblock %}
{% block nav_concours %}active{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{% url 'concours_liste' %}" class="btn btn-sm btn-outline-secondary mr-3"><i class="fas fa-arrow-left"></i></a>
  <h4 class="mb-0 font-weight-bold text-primary"><i class="fas fa-trophy mr-2"></i>{{ action }} un concours</h4>
</div>
<div class="card shadow" style="max-width:600px;">
  <div class="card-body p-4">
    <form method="POST" novalidate autocomplete="off">
      {% csrf_token %}
      <div class="form-group">
        <label><strong>Titre *</strong></label>
        <input type="text" class="form-control" name="titre"
          value="{% if post_data %}{{ post_data.titre }}{% elif concours %}{{ concours.titre }}{% endif %}"
          placeholder="Ex: Concours Informatique 2026">
      </div>
      <div class="form-group">
        <label><strong>Module</strong></label>
        <select class="form-control" name="module">
          <option value="">— Aucun —</option>
          {% for m in modules %}
          <option value="{{ m.pk }}"
            {% if post_data.module == m.pk|stringformat:"s" %}selected
            {% elif concours.module_id == m.pk %}selected{% endif %}>
            {{ m.nom }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="d-flex justify-content-end mt-3">
        <a href="{% url 'concours_liste' %}" class="btn btn-secondary mr-2">Annuler</a>
        <button type="submit" class="btn btn-primary"><i class="fas fa-save mr-1"></i>{{ action }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
