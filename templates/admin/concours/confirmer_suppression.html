{% extends 'admin/base_admin.html' %}
{% block title %}Confirmer la suppression – Smart QCM{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow border-left-danger">
      <div class="card-body p-5 text-center">
        <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
        <h5 class="font-weight-bold mb-2">Confirmer la suppression</h5>
        <p class="text-muted mb-4">
          Vous allez supprimer : <strong>{{ objet }}</strong><br>
          <span class="text-danger small">Cette action est irréversible.</span>
        </p>
        <form method="POST">
          {% csrf_token %}
          <a href="javascript:history.back()" class="btn btn-secondary mr-2">
            <i class="fas fa-times mr-1"></i>Annuler
          </a>
          <button type="submit" class="btn btn-danger">
            <i class="fas fa-trash mr-1"></i>Supprimer
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
