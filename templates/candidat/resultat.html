<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Résultat – Smart QCM</title>
  {% load static %}
  <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/sb-admin-2.css' %}" rel="stylesheet">
  <style>
    body { background: #f4f6fc; }
  </style>
</head>
<body>

<nav class="navbar navbar-light bg-white shadow-sm mb-4">
  <div class="container-fluid">
    <span class="navbar-brand font-weight-bold text-primary">
      <i class="fas fa-brain mr-2"></i>Smart QCM
    </span>
    <a href="{% url 'dashboard_candidat' %}" class="btn btn-sm btn-outline-primary">
      <i class="fas fa-home mr-1"></i>Mon espace
    </a>
  </div>
</nav>

<div class="container" style="max-width:550px;">
  <div class="card shadow border-0 mb-4">
    <div class="card-body text-center py-5 px-4">

      <i class="fas fa-check-circle fa-5x text-success mb-4"></i>
      <h4 class="font-weight-bold text-gray-800 mb-2">Examen soumis !</h4>
      <p class="text-muted mb-4">Vous avez terminé cet examen. Vos réponses ont été enregistrées.</p>

      <!-- Détails examen -->
      <div class="card border-0 bg-light mb-4">
        <div class="card-body text-left py-3 px-4">
          <div class="row">
            <div class="col-6">
              <div class="text-muted small">Examen</div>
              <div class="font-weight-bold">{{ examen.titre }}</div>
            </div>
            <div class="col-6">
              <div class="text-muted small">Date de passage</div>
              <div class="font-weight-bold">{{ resultat.date_passage|date:"d/m/Y à H:i" }}</div>
            </div>
          </div>
        </div>
      </div>

      <a href="{% url 'dashboard_candidat' %}" class="btn btn-primary btn-lg px-5">
        <i class="fas fa-home mr-2"></i>Retour à mon espace
      </a>

    </div>
  </div>
</div>

<script src="{% static 'vendor/jquery/jquery.js' %}"></script>
<script src="{% static 'vendor/bootstrap/js/bootstrap.js' %}"></script>
</body>
</html>
