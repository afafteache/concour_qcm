{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Administrateur – Smart QCM</title>
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900" rel="stylesheet">
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a2a5e 0%, #4e73df 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .register-card { background: white; border-radius: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden; width: 100%; max-width: 480px; }
        .register-header { background: linear-gradient(135deg, #1a2a5e, #4e73df); padding: 30px; text-align: center; }
        .register-body { padding: 32px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #4a5568; text-transform: uppercase; letter-spacing: 0.05em; }
        .form-control { border-radius: 8px; border: 1px solid #e3e6f0; padding: 10px 14px; font-size: 13px; }
        .form-control:focus { border-color: #4e73df; box-shadow: 0 0 0 3px rgba(78,115,223,0.15); }
        .btn-register { width: 100%; padding: 12px; border-radius: 8px; background: #4e73df; color: white; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
        .btn-register:hover { background: #2e59d9; }
        .admin-badge { background: #ebf0fc; border: 2px solid #4e73df; border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 20px; }
        .admin-badge i { color: #4e73df; font-size: 1.8rem; display: block; margin-bottom: 6px; }
        .admin-badge span { font-size: 13px; font-weight: 700; color: #4e73df; }
    </style>
</head>
<body>
<div class="register-card">
    <div class="register-header">
        <i class="fas fa-brain fa-2x text-white mb-2"></i>
        <h4 class="text-white font-weight-bold mb-1">Smart QCM</h4>
        <p class="text-white-50 small mb-0">Inscription Administrateur</p>
    </div>

    <div class="register-body">

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show py-2">
            <small>{{ message }}</small>
            <button type="button" class="close py-2" data-dismiss="alert"><span>&times;</span></button>
        </div>
        {% endfor %}
        {% endif %}

        <!-- Badge admin -->
        <div class="admin-badge">
            <i class="fas fa-user-shield"></i>
            <span>Compte Administrateur</span>
        </div>

        <form method="POST">
            {% csrf_token %}
            <input type="hidden" name="role" value="admin">

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label>Prénom *</label>
                    <input type="text" name="first_name" class="form-control" placeholder="Prénom" required>
                </div>
                <div class="form-group col-md-6">
                    <label>Nom *</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Nom" required>
                </div>
            </div>

            <div class="form-group">
                <label>CIN *</label>
                <input type="text" name="cin" class="form-control" placeholder="Votre numéro CIN" required>
            </div>

            <div class="form-group">
                <label>Email <small class="text-muted">(optionnel)</small></label>
                <input type="email" name="email" class="form-control" placeholder="email@exemple.com">
            </div>

            <div class="form-group">
                <label>Mot de passe *</label>
                <input type="password" name="password" class="form-control" placeholder="Mot de passe" required>
            </div>

            <div class="form-group">
                <label>Confirmer le mot de passe *</label>
                <input type="password" name="password2" class="form-control" placeholder="Confirmer" required>
            </div>

            <button type="submit" class="btn-register">
                <i class="fas fa-user-shield mr-2"></i>Créer mon compte administrateur
            </button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Déjà un compte ?
                <a href="{% url 'login' %}" style="color:#4e73df; font-weight:700;">Se connecter</a>
            </small>
        </div>
        <div class="text-center mt-2">
            <a href="{% url 'home' %}" style="color:#a0aec0; font-size:12px;">
                <i class="fas fa-arrow-left mr-1"></i>Retour à l'accueil
            </a>
        </div>
    </div>
</div>

<script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
