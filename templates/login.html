<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion – Smart QCM</title>
  {% load static %}
  <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/sb-admin-2.css' %}" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
<div class="container">
  <div class="row justify-content-center align-items-center" style="min-height:100vh;">
    <div class="col-xl-5 col-lg-6 col-md-8">

      <div class="card o-hidden border-0 shadow-lg">
        <div class="card-body p-0">

          <!-- En-tête colorée -->
          <div class="p-5 text-center" style="background:linear-gradient(135deg,#4e73df,#224abe);border-radius:0.35rem 0.35rem 0 0;">
            <i class="fas fa-brain fa-3x text-white mb-3"></i>
            <h3 class="text-white font-weight-bold mb-1">Smart QCM</h3>
            <p class="text-white-50 mb-0">Espace Administrateur &amp; Enseignant</p>
          </div>

          <div class="p-5">
            {% if messages %}
              {% for msg in messages %}
                <div class="alert alert-{{ msg.tags }} alert-dismissible fade show">
                  {{ msg }}<button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
                </div>
              {% endfor %}
            {% endif %}

            <form method="POST">
              {% csrf_token %}

              <div class="form-group">
                <label class="text-gray-700 font-weight-bold small">CIN</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-id-card text-primary"></i></span>
                  </div>
                  <input type="text" class="form-control form-control-user" name="cin"
                         placeholder="Votre numéro CIN" autofocus required>
                </div>
              </div>

              <div class="form-group">
                <label class="text-gray-700 font-weight-bold small">Mot de passe</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-lock text-primary"></i></span>
                  </div>
                  <input type="password" class="form-control form-control-user" name="password"
                         placeholder="Mot de passe" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary btn-user btn-block mt-4">
                <i class="fas fa-sign-in-alt mr-2"></i>Se connecter
              </button>
            </form>

            <hr>
            <div class="text-center">
              <a href="{% url 'login_candidat' %}" class="small text-primary">
                <i class="fas fa-user-graduate mr-1"></i>Espace Candidat
              </a>
            </div>
          </div>

        </div>
      </div>

      <div class="text-center mt-3 text-white-50 small">
        École Supérieure de Technologie – Dakhla
      </div>
    </div>
  </div>
</div>
<script src="{% static 'vendor/jquery/jquery.js' %}"></script>
<script src="{% static 'vendor/bootstrap/js/bootstrap.js' %}"></script>
</body>
</html>
